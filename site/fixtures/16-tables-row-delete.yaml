cat: Tables
name: table row delete
syntax: "etch table row delete <file> <match>"
desc: Delete rows matching a condition.
example: "etch table row delete data.csv status=closed"
file: data.csv
before: |
  id,status,owner
  1,open,alice
  2,closed,bob
  3,open,carol
args:
  - table
  - row
  - delete
  - data.csv
  - status=closed
