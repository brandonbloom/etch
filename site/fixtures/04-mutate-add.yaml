cat: Mutate
name: add
syntax: "etch add <file> <selector> <value>"
desc: Ensure an array contains a value. No-op if already present.
example: "etch add people/alice.md tags vip"
file: people/alice.md
before: |
  ---
  name: Alice Chen
  tags: [partner, technical]
  ---

  ## Notes

  Key decision-maker.
args:
  - add
  - people/alice.md
  - tags
  - vip
