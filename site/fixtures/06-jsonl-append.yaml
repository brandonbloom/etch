cat: JSONL
name: append (jsonl)
syntax: "etch append <file.jsonl> '<json>'"
desc: Append one compact JSON record, preserving object member order. Missing files are created.
example: "etch append events.jsonl '{\"kind\":\"deploy\",\"at\":\"2026-05-02T14:00:00Z\"}'"
file: events.jsonl
before: |
  {"kind":"heartbeat","at":"2026-05-02T13:00:00Z"}
  {"kind":"sync","at":"2026-05-02T13:30:00Z"}
args:
  - append
  - events.jsonl
  - '{"kind":"deploy","at":"2026-05-02T14:00:00Z"}'
