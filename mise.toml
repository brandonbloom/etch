[env]
ETCH_HOME = "{{ config_root }}"
GOCACHE = "{{ config_root }}/.cache/go-build"
GOMODCACHE = "{{ config_root }}/.cache/go-mod"
GOEXPERIMENT = "jsonv2"
_.path = ["{{ config_root }}/bin"]

[tasks.build]
description = "Build etch binaries into ./bin"
run = "mkdir -p ./bin && go build -o ./bin/ ./cmd/..."

[tasks.test]
description = "Run all Go tests"
run = "go test ./..."

[tasks."site:verify"]
description = "Verify cheatsheet fixtures and generate site reference data"
depends = ["build"]
run = "go run site/gen-commands.go"

[tasks.site]
description = "Build the site into site/public"
depends = ["site:verify"]
run = "go tool hugo --source site --cleanDestinationDir"

[tasks."site:serve"]
description = "Start the site dev server"
depends = ["site:verify"]
run = "go tool hugo server --source site --cleanDestinationDir"
